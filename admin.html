<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OD. Control Room</title><link rel="stylesheet" href="admin.css"></head><body><header>OD<span>.</span> <small>CONTROL ROOM</small></header><main><section id="login"><p>ADMIN ACCESS</p><h1>CONTROL<br>ROOM.</h1><form id="loginform"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button>SIGN IN ↗</button></form><p id="loginmsg"></p></section><section id="dash" hidden><div class="bar"><h1>THE ARCHIVE.</h1><button id="logout" class="alt">SIGN OUT</button></div><p id="stats"></p><button id="add">+ ADD NEW WORK</button><form id="editor" hidden><input id="id" type="hidden"><label>Title<input id="title" required></label><label>Vimeo URL<input id="url" type="url" placeholder="https://vimeo.com/123456" required></label><label>Category<select id="cat"><option>Projects</option><option>Reels</option><option>Breakdown</option><option>BTS</option></select></label><label>Display order<input id="sort" type="number" value="0"></label><label>Description<textarea id="desc"></textarea></label><label>Thumbnail image<input id="image" type="file" accept="image/*"></label><label class="check"><input id="pub" type="checkbox" checked> Publish on website</label><button>SAVE WORK ↗</button><button type="button" id="cancel" class="alt">CANCEL</button><p id="formmsg"></p></form><div id="list"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
